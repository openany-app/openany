[package]
name = "openany-nahbereich"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net"] }
# Finden und Vertrauen ueber das LocalSend-Protokoll. Nicht auf crates.io;
# fest auf einen Stand gepinnt, weil `packages/core` keine Versionen fuehrt.
# Am 15.09.2026 auf Mac, Telefon (Hotspot) und Tablet erprobt
# (docs/plan-app-neuaufsatz.md, APK 0.1 Schritt 1).
localsend = { git = "https://github.com/localsend/localsend", rev = "230fb692962668ca22ce0e61a8f53ce1cfd32102", features = ["discovery"] }

# Der eigene Dienst fuer Paaren und (spaeter) Abgleich: HTTPS mit
# gegenseitiger Zertifikatspruefung. Dieselben Fassungen, die localsend und
# openany-client ohnehin mitbringen -- kein zweiter TLS-Stapel.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Pruefen der Unterschriften unter Geraeteeintraegen (person.rs) -- dieselbe
# Fassung, die rustls ohnehin mitbringt.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = { workspace = true }
uuid = { workspace = true }
# Der Abgleich zwischen gepaarten Geraeten (APK 0.1, Schritt 5): dieselben
# Regeln wie gegen openany, nur antwortet hier das andere Geraet.
openany-client = { path = "../openany-client" }
openany-store = { path = "../openany-store" }
openany-sync = { path = "../openany-sync" }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
